name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip check
      - name: Check Python syntax
        run: python -m compileall -q main.py config.py database.py auth_bot.py services repositories web
      - name: Verify migrations on an empty database
        env:
          DB_PATH: ':memory:'
        run: python -c "from database import init_database; init_database()"
